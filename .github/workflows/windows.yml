name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Startup smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = Get-ChildItem build -Recurse -Filter task_notebook_gui.exe | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--portable", "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Startup smoke test timed out"
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          cmake --install build --prefix dist --config Release
          windeployqt --release --no-translations --compiler-runtime dist\task_notebook_gui.exe
          Compress-Archive -Path dist\* -DestinationPath task_notebook_gui-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: task_notebook_gui-windows
          path: task_notebook_gui-windows.zip
          if-no-files-found: error
