name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          cmake --install build --prefix dist --config Release
          windeployqt --release --no-translations dist\task_notebook_gui.exe
          Compress-Archive -Path dist\* -DestinationPath task_notebook_gui-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: task_notebook_gui-windows
          path: task_notebook_gui-windows.zip
          if-no-files-found: error
